  <title
     id="title1">Bullwheel icon in Frappe module-icon style</title>
  <desc
     id="desc1">A flat solid-blue rounded square containing a simplified white bullwheel glyph: a rimmed wheel with spokes and hub, mounted on a post, with a cable wrapping over the top and descending on both sides.</desc>
